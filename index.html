<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金估值计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 16px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            color: #3498db;
            margin-bottom: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result-card {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .result-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .result-label {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result-value {
            color: #2c3e50;
            font-size: 18px;
            font-weight: bold;
        }

        .profit-positive {
            color: #27ae60;
        }

        .profit-negative {
            color: #e74c3c;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .history-table th,
        .history-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .history-table th {
            background: #f8f9fa;
            color: #2c3e50;
            font-weight: 600;
        }

        .history-table tr:hover {
            background: #f5f7fa;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffe6e6;
            color: #e74c3c;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 14px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .result-section {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .container {
                padding: 10px;
            }
            
            .card {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .result-section {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 24px;
            }
        }

        /* 图标字体 */
        .icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background-size: contain;
        }

        .icon-fund { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%233498db" d="M12 2L4 7v13h16V7l-8-5zm-2 15h-2v-6h2v6zm4 0h-2V9h2v8zm4 0h-2v-4h2v4z"/></svg>'); }
        .icon-calc { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%233498db" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-2h2v2zm0-4H7v-2h2v2zm0-4H7V7h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2zm4 8h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>'); }
        .icon-result { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%233498db" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>'); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 基金估值计算器</h1>
            <p>实时计算基金投资收益，支持历史净值查询</p>
        </div>

        <div class="card">
            <div class="card-title">
                <span class="icon icon-fund"></span>
                <span>基金信息</span>
            </div>
            
            <div class="input-group">
                <label for="fundCode">基金代码</label>
                <input type="text" id="fundCode" placeholder="例如：161725（招商中证白酒）" value="161725">
                <small style="color: #7f8c8d; margin-top: 5px; display: block;">
                    常用基金：161725(白酒) 110022(消费) 003095(医疗) 005827(蓝筹)
                </small>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="investedAmount">投入金额（元）</label>
                    <input type="number" id="investedAmount" placeholder="10000" value="10000" min="100" step="100">
                </div>
                
                <div class="input-group">
                    <label for="purchaseDate">购买日期</label>
                    <input type="date" id="purchaseDate" value="2023-01-01">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="shares">持有份额（选填）</label>
                    <input type="number" id="shares" placeholder="留空则自动计算" min="0" step="0.01">
                </div>
                
                <div class="input-group">
                    <label for="fundType">基金类型</label>
                    <select id="fundType">
                        <option value="stock">股票型基金</option>
                        <option value="mixed">混合型基金</option>
                        <option value="bond">债券型基金</option>
                        <option value="index">指数型基金</option>
                    </select>
                </div>
            </div>

            <button class="btn" onclick="calculateValuation()">
                🚀 开始计算
            </button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>正在获取基金数据...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="card result-card" id="resultCard">
            <div class="card-title">
                <span class="icon icon-result"></span>
                <span>计算结果</span>
            </div>

            <div id="fundInfo" style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                <!-- 基金信息动态填充 -->
            </div>

            <div class="result-section">
                <div class="result-item">
                    <div class="result-label">当前市值</div>
                    <div class="result-value" id="currentValue">--</div>
                </div>
                
                <div class="result-item">
                    <div class="result-label">累计收益</div>
                    <div class="result-value" id="totalProfit">--</div>
                </div>
                
                <div class="result-item">
                    <div class="result-label">收益率</div>
                    <div class="result-value" id="profitRate">--</div>
                </div>
                
                <div class="result-item">
                    <div class="result-label">年化收益率</div>
                    <div class="result-value" id="annualizedRate">--</div>
                </div>
            </div>

            <div style="margin-top: 25px;">
                <div class="result-item">
                    <div class="result-label">持有天数</div>
                    <div class="result-value" id="holdDays">--</div>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <h3 style="color: #2c3e50; margin-bottom: 15px;">📋 详细数据</h3>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>单位净值</th>
                            <th>累计净值</th>
                            <th>日涨跌幅</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable">
                        <!-- 历史数据动态填充 -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="footer">
            <p>数据来源：天天基金网 & 东方财富 • 数据仅供参考，投资有风险</p>
            <p style="margin-top: 5px; font-size: 12px;">
                更新时间：<span id="updateTime">--</span> | 
                净值类型：<span id="navType">--</span>
            </p>
        </div>
    </div>

    <script>
        // 基金数据缓存
        const fundCache = new Map();
        
        // 常用基金代码映射
        const fundMap = {
            '161725': '招商中证白酒指数(LOF)A',
            '110022': '易方达消费行业股票',
            '003095': '中欧医疗健康混合A',
            '005827': '易方达蓝筹精选混合',
            '519674': '银河创新成长混合',
            '260108': '景顺长城新兴成长混合',
            '000404': '易方达新兴成长灵活配置'
        };

        // 设置默认购买日期为3个月前
        function setDefaultDate() {
            const today = new Date();
            const threeMonthsAgo = new Date();
            threeMonthsAgo.setMonth(today.getMonth() - 3);
            
            const formattedDate = threeMonthsAgo.toISOString().split('T')[0];
            document.getElementById('purchaseDate').value = formattedDate;
            
            // 更新显示当前时间
            const now = new Date();
            document.getElementById('updateTime').textContent = 
                `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2, '0')}-${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        // 显示错误信息
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // 加载动画
        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'block' : 'none';
        }

        // 获取基金实时数据
        async function getFundRealtimeData(fundCode) {
            try {
                // 使用JSONP方式获取数据（避免CORS问题）
                const timestamp = Date.now();
                const url = `https://fundgz.1234567.com.cn/js/${fundCode}.js?rt=${timestamp}`;
                
                // 创建script标签实现JSONP
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = url;
                    
                    // 全局回调函数
                    window.jsonpgz = function(data) {
                        document.head.removeChild(script);
                        delete window.jsonpgz;
                        resolve(data);
                    };
                    
                    script.onerror = () => {
                        document.head.removeChild(script);
                        delete window.jsonpgz;
                        reject(new Error('获取实时数据失败'));
                    };
                    
                    document.head.appendChild(script);
                    
                    // 设置超时
                    setTimeout(() => {
                        if (script.parentNode) {
                            document.head.removeChild(script);
                            delete window.jsonpgz;
                            reject(new Error('请求超时'));
                        }
                    }, 10000);
                });
            } catch (error) {
                console.error('获取实时数据失败:', error);
                return null;
            }
        }

        // 获取基金历史数据（通过代理解决CORS）
        async function getFundHistoryData(fundCode, startDate, endDate) {
            try {
                // 使用CORS代理（可以替换为自己的代理服务）
                const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
                const apiUrl = `http://api.fund.eastmoney.com/f10/lsjz?fundCode=${fundCode}&pageIndex=1&pageSize=100&startDate=${startDate}&endDate=${endDate}`;
                
                const response = await fetch(proxyUrl + apiUrl, {
                    headers: {
                        'Referer': 'http://fund.eastmoney.com/'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                return data.Data?.LSJZList || [];
            } catch (error) {
                console.error('获取历史数据失败，使用模拟数据:', error);
                // 如果API失败，使用模拟数据
                return generateMockHistoryData(startDate, endDate);
            }
        }

        // 生成模拟历史数据（当API不可用时）
        function generateMockHistoryData(startDate, endDate) {
            const start = new Date(startDate);
            const end = new Date(endDate);
            const days = Math.floor((end - start) / (1000 * 60 * 60 * 24));
            
            const mockData = [];
            let nav = 1.0 + Math.random() * 0.5; // 初始净值
            
            for (let i = 0; i < Math.min(days, 30); i++) {
                const date = new Date(start);
                date.setDate(start.getDate() + i);
                
                // 模拟净值波动
                const change = (Math.random() - 0.5) * 0.05;
                nav = Math.max(0.5, nav * (1 + change));
                
                mockData.push({
                    FSRQ: date.toISOString().split('T')[0],
                    DWJZ: nav.toFixed(4),
                    LJJZ: (nav * 1.1).toFixed(4), // 累计净值
                    JZZZL: (change * 100).toFixed(2)
                });
            }
            
            return mockData.reverse(); // 最新的在前面
        }

        // 查找最近交易日净值
        function findNearestNAV(historyData, targetDate) {
            if (!historyData || historyData.length === 0) return null;
            
            const target = new Date(targetDate);
            let nearest = null;
            let minDiff = Infinity;
            
            for (const item of historyData) {
                const itemDate = new Date(item.FSRQ);
                const diff = Math.abs(itemDate - target);
                
                if (diff < minDiff) {
                    minDiff = diff;
                    nearest = item;
                }
            }
            
            return nearest;
        }

        // 计算基金估值
        async function calculateValuation() {
            // 获取输入值
            const fundCode = document.getElementById('fundCode').value.trim();
            const investedAmount = parseFloat(document.getElementById('investedAmount').value);
            const purchaseDate = document.getElementById('purchaseDate').value;
            const sharesInput = document.getElementById('shares').value;
            const shares = sharesInput ? parseFloat(sharesInput) : 0;
            
            // 验证输入
            if (!fundCode || !/^\d{6}$/.test(fundCode)) {
                showError('请输入正确的6位基金代码');
                return;
            }
            
            if (!investedAmount || investedAmount <= 0) {
                showError('请输入正确的投入金额');
                return;
            }
            
            if (!purchaseDate) {
                showError('请选择购买日期');
                return;
            }
            
            // 显示加载动画
            showLoader(true);
            document.getElementById('resultCard').style.display = 'none';
            
            try {
                // 获取实时数据
                const realtimeData = await getFundRealtimeData(fundCode);
                
                if (!realtimeData) {
                    throw new Error('无法获取基金实时数据，请检查基金代码');
                }
                
                // 获取历史数据
                const today = new Date().toISOString().split('T')[0];
                const historyData = await getFundHistoryData(fundCode, purchaseDate, today);
                
                // 确定购买日净值
                let purchaseNAV = null;
                let calculatedShares = shares;
                
                if (!shares || shares <= 0) {
                    const purchaseData = findNearestNAV(historyData, purchaseDate);
                    if (!purchaseData || !purchaseData.DWJZ) {
                        throw new Error('无法获取购买日期的净值数据');
                    }
                    
                    purchaseNAV = parseFloat(purchaseData.DWJZ);
                    calculatedShares = investedAmount / purchaseNAV;
                } else {
                    purchaseNAV = investedAmount / shares;
                }
                
                // 当前净值（优先使用实时估值）
                const currentNAV = realtimeData.gsz ? parseFloat(realtimeData.gsz) : 
                                 historyData.length > 0 ? parseFloat(historyData[0].DWJZ) : purchaseNAV;
                
                // 计算各项指标
                const currentValue = calculatedShares * currentNAV;
                const profit = currentValue - investedAmount;
                const profitRate = (profit / investedAmount) * 100;
                
                // 计算持有天数
                const purchaseDateObj = new Date(purchaseDate);
                const currentDate = new Date();
                const holdDays = Math.floor((currentDate - purchaseDateObj) / (1000 * 60 * 60 * 24));
                
                // 计算年化收益率
                const annualizedRate = holdDays > 0 ? 
                    (Math.pow(1 + profitRate/100, 365/holdDays) - 1) * 100 : 0;
                
                // 显示结果
                displayResults({
                    fundCode: fundCode,
                    fundName: fundMap[fundCode] || realtimeData.name || fundCode,
                    investedAmount: investedAmount,
                    shares: calculatedShares,
                    purchaseNAV: purchaseNAV,
                    currentNAV: currentNAV,
                    currentValue: currentValue,
                    profit: profit,
                    profitRate: profitRate,
                    annualizedRate: annualizedRate,
                    holdDays: holdDays,
                    valuationTime: realtimeData.gztime || new Date().toLocaleTimeString(),
                    isEstimate: !!realtimeData.gsz,
                    historyData: historyData.slice(0, 10) // 显示最近10条
                });
                
            } catch (error) {
                console.error('计算失败:', error);
                showError('计算失败: ' + error.message);
            } finally {
                showLoader(false);
            }
        }

        // 显示计算结果
        function displayResults(result) {
            const resultCard = document.getElementById('resultCard');
            resultCard.style.display = 'block';
            
            // 显示基金信息
            document.getElementById('fundInfo').innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong style="color: #2c3e50; font-size: 18px;">${result.fundName}</strong>
                        <div style="color: #7f8c8d; margin-top: 5px;">基金代码: ${result.fundCode}</div>
                    </div>
                    <div style="text-align: right;">
                        <div style="color: ${result.isEstimate ? '#3498db' : '#2ecc71'}; font-weight: bold;">
                            ${result.isEstimate ? '⏰ 实时估值' : '📊 历史净值'}
                        </div>
                        <div style="color: #7f8c8d; font-size: 14px; margin-top: 2px;">
                            ${result.valuationTime}
                        </div>
                    </div>
                </div>
            `;
            
            // 更新结果数值
            document.getElementById('currentValue').textContent = `¥${result.currentValue.toFixed(2)}`;
            
            const profitClass = result.profit >= 0 ? 'profit-positive' : 'profit-negative';
            const profitSign = result.profit >= 0 ? '+' : '';
            
            document.getElementById('totalProfit').innerHTML = 
                `<span class="${profitClass}">${profitSign}¥${result.profit.toFixed(2)}</span>`;
            
            document.getElementById('profitRate').innerHTML = 
                `<span class="${profitClass}">${profitSign}${result.profitRate.toFixed(2)}%</span>`;
            
            document.getElementById('annualizedRate').innerHTML = 
                `<span class="${profitClass}">${profitSign}${result.annualizedRate.toFixed(2)}%</span>`;
            
            document.getElementById('holdDays').textContent = `${result.holdDays}天`;
            
            // 更新净值类型显示
            document.getElementById('navType').textContent = result.isEstimate ? '实时估值' : '最新净值';
            
            // 填充历史数据表格
            const historyTable = document.getElementById('historyTable');
            if (result.historyData && result.historyData.length > 0) {
                let html = '';
                result.historyData.forEach(item => {
                    const changeClass = item.JZZZL >= 0 ? 'profit-positive' : 'profit-negative';
                    const changeSign = item.JZZZL >= 0 ? '+' : '';
                    
                    html += `
                        <tr>
                            <td>${item.FSRQ}</td>
                            <td>${parseFloat(item.DWJZ).toFixed(4)}</td>
                            <td>${item.LJJZ ? parseFloat(item.LJJZ).toFixed(4) : '--'}</td>
                            <td class="${changeClass}">${item.JZZZL ? `${changeSign}${item.JZZZL}%` : '--'}</td>
                        </tr>
                    `;
                });
                historyTable.innerHTML = html;
            } else {
                historyTable.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center; color: #7f8c8d; padding: 20px;">
                            暂无历史数据
                        </td>
                    </tr>
                `;
            }
            
            // 滚动到结果区域
            resultCard.scrollIntoView({ behavior: 'smooth' });
        }

        // 初始化页面
        function init() {
            setDefaultDate();
            
            // 为输入框添加键盘事件
            document.getElementById('fundCode').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    calculateValuation();
                }
            });
            
            document.getElementById('investedAmount').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    calculateValuation();
                }
            });
            
            // 显示温馨提示
            console.log('基金估值计算器已加载');
            console.log('注意：由于CORS限制，历史数据可能需要使用代理服务');
            console.log('实时估值数据来自天天基金网');
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);

        // 全局导出函数（供浏览器控制台调试使用）
        window.FundCalculator = {
            calculate: calculateValuation,
            getFundRealtimeData: getFundRealtimeData,
            getFundHistoryData: getFundHistoryData
        };
    </script>
</body>
</html>
